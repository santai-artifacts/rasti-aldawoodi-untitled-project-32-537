<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aria — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0f19;
    --bg-2: #111827;
    --panel: #151c2c;
    --panel-2: #1b2438;
    --border: #263145;
    --text: #e8ecf4;
    --text-dim: #9aa6bd;
    --accent: #6d8cff;
    --accent-2: #8b5cf6;
    --user-bubble: linear-gradient(135deg, #6d8cff, #8b5cf6);
    --shadow: 0 10px 40px rgba(0,0,0,0.4);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(139,92,246,0.18), transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, rgba(109,140,255,0.15), transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 820px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 6px 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--user-bubble);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 18px;
    box-shadow: 0 6px 18px rgba(109,140,255,0.35);
    flex-shrink: 0;
  }

  .title h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .title p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #33d17a; box-shadow: 0 0 8px #33d17a;
  }
  .dot.off { background: #f0a; box-shadow: none; }

  .btn-clear {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
  }
  .btn-clear:hover { color: var(--text); border-color: var(--accent); }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 6px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }

  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 88%;
    animation: rise .35s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 13px; font-weight: 600;
    margin-top: 2px;
  }
  .avatar.bot { background: var(--panel-2); border: 1px solid var(--border); }
  .avatar.me { background: var(--user-bubble); }

  .bubble {
    padding: 12px 15px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 14.5px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.bot .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-left-radius: 5px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    border-top-right-radius: 5px;
    color: #fff;
  }

  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: rgba(0,0,0,0.35);
    padding: 2px 6px;
    border-radius: 6px;
  }
  .bubble pre {
    background: #0a0e17;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble a { color: #a9bcff; }

  .typing { display: flex; gap: 5px; padding: 4px 2px; }
  .typing span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim);
    animation: blink 1.3s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; transform: translateY(0);} 30% { opacity: 1; transform: translateY(-3px);} }

  .composer {
    padding: 14px 6px 20px;
    border-top: 1px solid var(--border);
  }
  .composer-inner {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .composer-inner:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(109,140,255,0.15);
  }
  textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    resize: none;
    outline: none;
    max-height: 160px;
    line-height: 1.5;
    padding: 6px 0;
  }
  textarea::placeholder { color: var(--text-dim); }

  .send {
    width: 40px; height: 40px;
    border-radius: 11px;
    border: none;
    background: var(--user-bubble);
    color: #fff;
    cursor: pointer;
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: transform .12s ease, opacity .15s ease;
  }
  .send:hover:not(:disabled) { transform: translateY(-1px); }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .send svg { width: 19px; height: 19px; }

  .hint { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 10px; }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-top: 8px;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); transform: translateY(-1px); }

  .welcome {
    margin: auto;
    text-align: center;
    max-width: 460px;
    animation: rise .5s ease both;
  }
  .welcome .logo { width: 56px; height: 56px; font-size: 24px; border-radius: 16px; margin: 0 auto 18px; }
  .welcome h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
  .welcome p { color: var(--text-dim); font-size: 14.5px; line-height: 1.6; margin: 0 0 20px; }

  @media (max-width: 560px) {
    .msg { max-width: 94%; }
    .app { padding: 0 10px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">A</div>
      <div class="title">
        <h1>Aria</h1>
        <p><span class="dot" id="statusDot"></span><span id="statusText">Online</span></p>
      </div>
      <button class="btn-clear" id="clearBtn">Clear</button>
    </header>

    <div class="chat" id="chat"></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Message Aria…" autofocus></textarea>
        <button class="send" id="send" title="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="hint">Aria can make mistakes. Enter to send · Shift+Enter for newline</div>
    </div>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clearBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  /** @type {{role:'user'|'assistant',content:string}[]} */
  let history = [];
  let busy = false;

  const SUGGESTIONS = [
    "Explain quantum computing simply",
    "Write a haiku about the ocean",
    "Give me a 20-min dinner idea",
    "Help me plan my week",
  ];

  // --- tiny, safe markdown renderer ---
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function renderMarkdown(src) {
    // fenced code blocks first
    const blocks = [];
    src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
      return '␀' + (blocks.length - 1) + '␀';
    });
    let html = escapeHtml(src);
    html = html.replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // lists + paragraphs
    const lines = html.split('\n');
    let out = '', inList = false, listType = '';
    const closeList = () => { if (inList) { out += '</' + listType + '>'; inList = false; } };
    let para = [];
    const flushPara = () => {
      if (para.length) { out += '<p>' + para.join('<br>') + '</p>'; para = []; }
    };
    for (const line of lines) {
      const ul = line.match(/^\s*[-*]\s+(.*)/);
      const ol = line.match(/^\s*\d+\.\s+(.*)/);
      if (ul || ol) {
        flushPara();
        const t = ul ? 'ul' : 'ol';
        if (!inList || listType !== t) { closeList(); out += '<' + t + '>'; inList = true; listType = t; }
        out += '<li>' + (ul ? ul[1] : ol[1]) + '</li>';
      } else if (line.trim() === '') {
        flushPara(); closeList();
      } else {
        closeList(); para.push(line);
      }
    }
    flushPara(); closeList();
    out = out.replace(/␀(\d+)␀/g, (_, i) => blocks[+i]);
    return out;
  }

  function showWelcome() {
    chat.innerHTML = `
      <div class="welcome">
        <div class="logo">A</div>
        <h2>Hey, I'm Aria</h2>
        <p>Your friendly AI companion. Ask me anything — ideas, explanations, drafts, or just a chat.</p>
        <div class="suggestions">
          ${SUGGESTIONS.map(s => `<button class="chip">${s}</button>`).join('')}
        </div>
      </div>`;
    chat.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => { input.value = chip.textContent; onInput(); send(); });
    });
  }

  function addMessage(role, content) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    const avatar = role === 'user' ? '<div class="avatar me">You</div>' : '<div class="avatar bot">A</div>';
    const body = role === 'user'
      ? '<div class="bubble">' + escapeHtml(content) + '</div>'
      : '<div class="bubble">' + renderMarkdown(content) + '</div>';
    wrap.innerHTML = avatar + body;
    chat.appendChild(wrap);
    scrollDown();
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.innerHTML = '<div class="avatar bot">A</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(wrap);
    scrollDown();
    return wrap;
  }

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;

    if (history.length === 0) chat.innerHTML = '';

    busy = true;
    updateSendState();
    addMessage('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    autoGrow();

    const typing = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        addMessage('assistant', '⚠️ ' + (data.error || 'Something went wrong.'));
      } else {
        addMessage('assistant', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (e) {
      typing.remove();
      addMessage('assistant', '⚠️ Network error. Please check your connection and try again.');
    } finally {
      busy = false;
      updateSendState();
      input.focus();
    }
  }

  function updateSendState() {
    sendBtn.disabled = busy || input.value.trim().length === 0;
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  function onInput() { autoGrow(); updateSendState(); }

  input.addEventListener('input', onInput);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);
  clearBtn.addEventListener('click', () => { history = []; showWelcome(); input.focus(); });

  // health check for status indicator
  fetch('/api/health').then(r => r.json()).then(d => {
    if (!d.ai) {
      statusDot.classList.add('off');
      statusText.textContent = 'AI offline';
    }
  }).catch(() => {});

  showWelcome();
</script>
</body>
</html>
